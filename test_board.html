<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html, body { height: 100%; margin: 0; }
        .game-screen { display: flex; flex-direction: column; min-height: 100%; background: yellow; }
        .header { height: 100px; background: red; }
        .footer { height: 100px; background: blue; }
        .main { flex: 1; position: relative; padding: 16px; overflow: hidden; }
        .board { position: relative; width: 100%; height: 100%; background: white; border: 4px solid black; }
        .num { position: absolute; width: 50px; height: 50px; background: green; }
    </style>
</head>
<body>
    <div class="game-screen">
        <div class="header"></div>
        <div class="main">
            <div class="board">
                <div class="num" style="left: 10px; top: 10px;"></div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
